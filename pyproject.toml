[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragqa"
version = "0.1.0"
description = "RAG-powered codebase Q&A assistant: AST-aware chunking, hybrid retrieval (vector + BM25), grounded answers with citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# AST-aware multi-language chunking (falls back to ast/regex chunkers if absent)
treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.6",
]
# LLM answer providers (offline extractive provider needs none of these)
anthropic = ["anthropic>=0.49"]
openai = ["openai>=1.60"]
# sentence-transformers embedding provider (pulls torch -- NOT installed by default)
sbert = ["sentence-transformers>=3.0"]
# pgvector-backed vector store (selected via DATABASE_URL)
pg = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragqa = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
